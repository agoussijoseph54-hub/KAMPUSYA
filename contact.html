<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact — SixPay</title><meta name="description" content="Contactez l'équipe SixPay."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div id="hdr"></div>
<main><div class="phead"><div class="wrap"><h1>Parlons de votre projet</h1><p>Une question ? Nous répondons sous 24 heures.</p></div></div>
<section><div class="wrap"><form class="f" data-form="contact">
<label>Nom<input name="name" required></label><label>E-mail<input type="email" name="email" required></label>
<label>Sujet<select name="subject"><option>Ouverture de compte</option><option>Tarifs</option><option>Support</option><option>Partenariat</option></select></label>
<label>Message<textarea name="message" rows="5" required></textarea></label><button class="btn dark">Envoyer le message</button></form><div class="msg" style="max-width:520px;margin:1rem auto 0"></div></div></section></main>
<div id="ftr"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/supabase.js"></script><script src="js/app.js"></script></body></html>
