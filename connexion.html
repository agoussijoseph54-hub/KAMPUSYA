<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion — SixPay</title><meta name="description" content="Accédez à votre espace SixPay ou ouvrez un compte."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div id="hdr"></div>
<main><div class="phead"><div class="wrap"><h1 id="tt">Content de vous revoir</h1></div></div>
<section><div class="wrap"><div class="auth"><button class="btn dark sm" id="b1">Connexion</button><button class="btn ghost sm" id="b2" style="color:var(--ink);border-color:#cdd8d2">Ouvrir un compte</button></div>
<form class="f" data-form="login" id="fl"><label>E-mail<input type="email" name="email" required></label><label>Mot de passe<input type="password" name="password" required minlength="8"></label><button class="btn dark">Se connecter</button><div class="msg"></div></form>
<form class="f" data-form="signup" id="fs" hidden><label>Nom complet<input name="name" required></label><label>E-mail<input type="email" name="email" required></label><label>Mot de passe (8 caractères min.)<input type="password" name="password" required minlength="8"></label><button class="btn dark">Créer mon compte</button><div class="msg"></div></form></div></section></main>
<script>addEventListener("DOMContentLoaded",()=>{const s=h=>{fl.hidden=h;fs.hidden=!h;tt.textContent=h?"Ouvrez votre compte":"Content de vous revoir"};b1.onclick=()=>s(false);b2.onclick=()=>s(true);if(location.hash==="#signup")s(true)})</script>
<div id="ftr"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/supabase.js"></script><script src="js/app.js"></script></body></html>
